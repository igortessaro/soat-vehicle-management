services:
  vehicle-management-db:
    image: mysql:8.4
    container_name: vehicle-management-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - vehicle_management_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
    networks:
      - fiap-network

  vehicle-management-migrations:
    image: flyway/flyway:latest
    command:
      - "-url=jdbc:mysql://vehicle-management-db:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false"
      - "-user=${MYSQL_USER}"
      - "-password=${MYSQL_PASSWORD}"
      - "-connectRetries=60"
      - "migrate"
    volumes:
      - ./database/migrations:/flyway/sql:ro
    depends_on:
      vehicle-management-db:
        condition: service_healthy
    networks:
      - fiap-network

  vehicle-management-api:
    build:
      context: .
      dockerfile: src/Fiap.Soat.VehicleManagement.Api/Dockerfile
    image: ${DOCKERHUB_USERNAME:-igortessaro}/fiap-soat-vehicle-management-api:local
    container_name: vehicle-management-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MySql: "server=vehicle-management-db;port=3306;database=${MYSQL_DATABASE};user=${MYSQL_USER};password=${MYSQL_PASSWORD};SslMode=None;AllowPublicKeyRetrieval=True;"
    ports:
      - "${VEHICLE_MANAGEMENT_API_PORT:-5180}:8080"
    depends_on:
      vehicle-management-db:
        condition: service_healthy
      vehicle-management-migrations:
        condition: service_completed_successfully
    networks:
      - fiap-network

networks:
  fiap-network:
    name: fiap-soat-network

volumes:
  vehicle_management_mysql_data:
